<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 60px 20px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccd3e0;
        }
        h1 { color: #2347a5; }
        p { color: #555; font-size: 18px; }
        button {
            background: #2347a5;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Attendance System</h1>
        <p>Welcome to our College Attendance Management Portal</p>
        <p>Manage students and track attendance easily.</p>
        <button onclick="window.location.href='/dashboard'">
            Get Started
        </button>
    </div>
</body>
</html>
